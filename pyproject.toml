[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bazimya"
version = "0.3.0"
description = "A Python web framework with no dependencies, deployable to shared hosting."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "bzsaph", email = "bazimyas@gmail.com" }]
maintainers = [{ name = "bzsaph", email = "bazimyas@gmail.com" }]
keywords = ["framework", "web", "mvc", "wsgi", "shared-hosting", "cpanel", "kinyarwanda", "i18n", "rwanda"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Natural Language :: English",
]

# The framework runs on the standard library alone. Database drivers beyond
# SQLite are optional, because a shared host that cannot pip install anything
# still has to be able to run this.
dependencies = []

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1"]
postgres = ["psycopg2-binary>=2.9"]
server = ["gunicorn>=21.2"]

[project.urls]
Homepage = "https://github.com/bzsaph/bazimya"
Repository = "https://github.com/bzsaph/bazimya"
Issues = "https://github.com/bzsaph/bazimya/issues"
Changelog = "https://github.com/bzsaph/bazimya/releases"

[project.scripts]
bazimya = "bazimya.console.kernel:main"

[tool.setuptools.packages.find]
include = ["bazimya*"]

[tool.setuptools.package-data]
bazimya = ["stubs/**/*", "stubs/**/.*"]

# The stub globs above are deliberately wide, so anything the operating system
# drops into a stub directory would otherwise be shipped and then scaffolded
# into every new project.
[tool.setuptools.exclude-package-data]
bazimya = ["**/.DS_Store", "**/Thumbs.db", "**/desktop.ini", "**/*.pyc"]
